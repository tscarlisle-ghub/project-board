name: Import Board Tasks

on:
  push:
    paths:
      - 'inbox/**.txt'
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install python-dateutil
      - run: python3 scripts/import_tasks.py
      - name: Commit changes
        run: |
          git config user.name "board-bot"
          git config user.email "board-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Import dictated tasks [skip ci]"
            git push
          fi
